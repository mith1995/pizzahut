# Render Blueprint: New -> Blueprint -> select this repo.
services:
  - type: web
    name: pizzahut-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    # Deploy only after the GitHub Actions checks pass
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Fill these in the Render dashboard (never commit real values):
      - key: DATABASE_URL            # Neon connection string
        sync: false
      - key: ALLOWED_HOSTS           # e.g. pizzahut-api.onrender.com
        sync: false
      - key: CORS_ALLOWED_ORIGINS    # e.g. https://pizzahut.vercel.app
        sync: false
      - key: CSRF_TRUSTED_ORIGINS    # e.g. https://pizzahut-api.onrender.com,https://pizzahut.vercel.app
        sync: false
      - key: FRONTEND_URL            # e.g. https://pizzahut.vercel.app (used in email links)
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # SMTP (names are MAILTRAP_* because settings.py reads them; any SMTP provider works)
      - key: MAILTRAP_HOST
        sync: false
      - key: MAILTRAP_PORT
        value: "587"
      - key: MAILTRAP_USERNAME
        sync: false
      - key: MAILTRAP_PASSWORD
        sync: false
